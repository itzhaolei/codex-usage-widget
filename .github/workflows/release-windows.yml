name: Release Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
      validate_only:
        description: Build and test without uploading a release asset
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - name: Resolve version
        shell: pwsh
        run: |
          $semver = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:REQUESTED_VERSION
          } else {
            if ($env:REQUESTED_VERSION -notmatch '^v(?<version>.+)$') {
              throw "Release tag must be vMAJOR.MINOR.PATCH: $env:REQUESTED_VERSION"
            }
            $version = $Matches.version
          }
          if ($version -notmatch $semver) {
            throw "Release version must be a complete MAJOR.MINOR.PATCH value: $version"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Verify release tag and source versions
        shell: pwsh
        run: |
          $tagCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve $env:RELEASE_TAG" }
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) {
            throw "Checked out commit $headCommit does not match $env:RELEASE_TAG ($tagCommit)."
          }

          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*([^\s+]+)(?:\+\S+)?\s*$') { throw 'Could not read pubspec.yaml version' }
          $pubspecVersion = $Matches[1]
          $appSource = Get-Content lib/desktop_app.dart -Raw
          if ($appSource -notmatch "(?m)^\s*const\s+appVersion\s*=\s*'([^']+)'\s*;\s*$") { throw 'Could not read appVersion' }
          $appVersion = $Matches[1]
          $pluginVersion = (Get-Content .codex-plugin/plugin.json -Raw | ConvertFrom-Json).version
          if ($pubspecVersion -ne $env:VERSION -or $appVersion -ne $env:VERSION -or $pluginVersion -ne $env:VERSION) {
            throw "Release $env:RELEASE_TAG does not match source versions: pubspec=$pubspecVersion appVersion=$appVersion plugin=$pluginVersion"
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify Flutter project
        shell: pwsh
        run: |
          flutter --version
          flutter pub get
          flutter analyze
          flutter test

      - name: Install packaging tools
        shell: pwsh
        run: |
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick --no-progress -y
          }
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Generate Windows application icon
        shell: pwsh
        run: |
          magick assets/icon.png -define icon:auto-resize=256,128,64,48,32,16 windows/runner/resources/app_icon.ico
          magick assets/icon.png -define icon:auto-resize=256,128,64,48,32,16 windows/QuotaBubble.ico

      - name: Build Flutter Windows application
        shell: pwsh
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-flutter-windows.ps1 $env:VERSION
          if (-not (Test-Path windows/publish/QuotaBubble.exe)) { throw "QuotaBubble.exe was not published" }

      - name: Smoke launch Flutter application
        shell: pwsh
        run: |
          $smokeHome = Join-Path $env:RUNNER_TEMP "quota-bubble-flutter-smoke"
          New-Item -ItemType Directory -Path $smokeHome -Force | Out-Null
          $env:CODEX_HOME = $smokeHome
          $process = Start-Process windows/publish/QuotaBubble.exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Flutter Quota Bubble exited during smoke launch" }
          Stop-Process -Id $process.Id -Force

      - name: Build graphical installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:VERSION" `
            "/DPublishDir=$((Resolve-Path windows/publish).Path)" `
            windows/installer.iss
          $installer = "dist/QuotaBubble-$env:VERSION-Windows-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Graphical installer was not created" }

      - name: Build legacy updater bridge
        shell: pwsh
        run: |
          $bridge = Join-Path $env:RUNNER_TEMP "QuotaBubble-$env:VERSION"
          New-Item -ItemType Directory -Path $bridge -Force | Out-Null
          Copy-Item windows/compat/install.ps1 (Join-Path $bridge "install.ps1")
          Copy-Item "dist/QuotaBubble-$env:VERSION-Windows-Setup.exe" $bridge
          Compress-Archive -Path $bridge -DestinationPath "dist/QuotaBubble-$env:VERSION-Windows.zip" -Force
          if (-not (Test-Path "dist/QuotaBubble-$env:VERSION-Windows.zip")) { throw "Legacy updater bridge was not created" }

      - name: Install graphical package silently
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist/QuotaBubble-$env:VERSION-Windows-Setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "Quota Bubble Installed"
          $legacyWidgetDir = Join-Path $env:USERPROFILE ".codex\usage-widget"
          $legacyScriptsDir = Join-Path $env:USERPROFILE ".codex\scripts"
          New-Item -ItemType Directory -Path $legacyWidgetDir, $legacyScriptsDir -Force | Out-Null
          $legacyFiles = @(
            (Join-Path $legacyWidgetDir "QuotaBubble.ps1"),
            (Join-Path $legacyWidgetDir "VERSION"),
            (Join-Path $legacyWidgetDir "windows-state.json"),
            (Join-Path $legacyScriptsDir "codex-usage-snapshot.mjs")
          )
          $legacyFiles | ForEach-Object { Set-Content -Path $_ -Value "legacy" }
          Set-Content -Path $legacyFiles[0] -Value 'while ($true) { Start-Sleep -Seconds 1 }'
          $legacyProcess = Start-Process "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -ArgumentList "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "`"$($legacyFiles[0])`"" -PassThru
          Start-Sleep -Milliseconds 500
          if ($legacyProcess.HasExited) { throw "Legacy Windows process did not start" }
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDir`" /MERGETASKS=`"!startup`""
          $process = Start-Process $installer -ArgumentList $arguments -PassThru
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir "QuotaBubble.exe"))) { throw "Installed application is missing" }
          $legacyFiles | ForEach-Object { if (Test-Path $_) { throw "Legacy Windows file was not removed: $_" } }
          $legacyProcess.Refresh()
          if (-not $legacyProcess.HasExited) {
            Stop-Process -Id $legacyProcess.Id -Force -ErrorAction SilentlyContinue
            throw "Legacy Windows process was not terminated"
          }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "Quota Bubble.lnk"
          if (-not (Test-Path $desktopShortcut)) { throw "Desktop shortcut was not created" }
          Start-Sleep -Seconds 5
          $installedProcess = Get-Process -Name "QuotaBubble" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $installedProcess -or $installedProcess.HasExited) { throw "Installed Quota Bubble did not start automatically" }
          "INSTALL_PID=$($installedProcess.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify automatically launched application
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          $process = Get-Process -Id ([int]$env:INSTALL_PID) -ErrorAction SilentlyContinue
          if ($null -eq $process -or $process.HasExited) { throw "Automatically launched Quota Bubble exited during smoke test" }
          Stop-Process -Id $process.Id -Force
          $uninstaller = Join-Path $env:INSTALL_DIR "unins000.exe"
          $result = Start-Process $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Uninstaller exited with $($result.ExitCode)" }

      - name: Keep Windows installers for validation
        uses: actions/upload-artifact@v4
        with:
          name: quota-bubble-windows-installers
          path: |
            dist/*-Windows-Setup.exe
            dist/*-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer to GitHub Release
        if: github.event_name == 'push' || inputs.validate_only == false
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $asset = "dist/QuotaBubble-$env:VERSION-Windows-Setup.exe"
          $bridge = "dist/QuotaBubble-$env:VERSION-Windows.zip"
          $notes = "docs/releases/$($env:VERSION).md"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @('release', 'create', $tag, '--repo', $env:GITHUB_REPOSITORY, '--title', "Quota Bubble $tag", '--verify-tag')
            if (Test-Path $notes) {
              $createArgs += @('--notes-file', $notes)
            } else {
              $createArgs += '--generate-notes'
            }
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) {
              $releaseFound = $false
              foreach ($attempt in 1..5) {
                gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
                if ($LASTEXITCODE -eq 0) {
                  $releaseFound = $true
                  break
                }
                Start-Sleep -Seconds 2
              }
              if (-not $releaseFound) { throw "Could not create or find GitHub Release $tag." }
            }
          }
          gh release upload $tag $asset $bridge --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload Windows assets to $tag." }
