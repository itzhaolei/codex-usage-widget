name: quota_bubble
description: "A Flutter desktop Codex quota widget for macOS and Windows."
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  crypto: ^3.0.6
  intl: ^0.20.2
  path_provider: ^2.1.5
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.3
  tray_manager: ^0.5.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/status.png
    - assets/tray.ico
